<app-header></app-header>

<main class="contenedor-listado">

  <h1>Lugares públicos</h1>

  <div class="grid-centros">

    @for (lugar of publicos; track lugar.id) {

      <div class="card-centro">

        <h2>{{ lugar.nombre }}</h2>

        <p><strong>Dirección:</strong> {{ lugar.direccion }}</p>

        <p><strong>Tipo:</strong> {{ lugar.tipo }}</p>

        <p><strong>Teléfono:</strong> {{ lugar.telefono }}</p>

        <p><strong>Horario:</strong> {{ lugar.horario }}</p>

        <p>{{ lugar.descripcion }}</p>

      </div>

    }

  </div>

</main>

<app-footer></app-footer>
