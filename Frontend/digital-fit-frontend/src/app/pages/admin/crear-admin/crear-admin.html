<app-header></app-header>

<main class="pagina-crear-admin">

  @if (mostrarPopup) {
    <div class="popup-overlay">
      <div class="popup-mensaje" [class.popup-error]="tipoPopup === 'error'">
        <p>{{ textoPopup }}</p>
        <button type="button" (click)="cerrarPopup()">Cerrar</button>
      </div>
    </div>
  }

  <section class="cabecera-pagina">
    <div class="cabecera-badge">Administración</div>
    <h1>Crear admin</h1>
    <p>
      Desde aquí puedes crear nuevos administradores de la aplicación.
    </p>
  </section>

  <section class="bloque-formulario">
    <div class="cabecera-formulario">
      <div>
        <span class="mini-etiqueta">Alta de usuario</span>
        <h2>Nuevo administrador</h2>
      </div>
      <p class="texto-apoyo">Rellena los datos para registrar un nuevo perfil administrador.</p>
    </div>

    <form class="formulario-admin" (ngSubmit)="crearAdmin()">

      <div class="grupo-campo">
        <label for="username">Nombre de usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          required
        >
      </div>

      <div class="grupo-campo">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
        >
      </div>

      <div class="grupo-campo">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
        >
      </div>

      <button type="submit" class="boton-guardar">
        Crear admin
      </button>

    </form>
  </section>

</main>

<app-footer></app-footer>
