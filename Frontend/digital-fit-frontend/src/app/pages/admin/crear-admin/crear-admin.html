<app-header></app-header>

<main class="pagina-crear-admin">

  <section class="cabecera-pagina">
    <h1>Crear admin</h1>
    <p>
      Desde aquí puedes crear nuevos administradores de la aplicación.
    </p>
  </section>

  <section class="bloque-formulario">
    <form class="formulario-admin" (ngSubmit)="crearAdmin()">

      <div class="grupo-campo">
        <label for="username">Nombre de usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          required
        >
      </div>

      <div class="grupo-campo">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
        >
      </div>

      <div class="grupo-campo">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
        >
      </div>

      <button type="submit" class="boton-guardar">
        Crear admin
      </button>

      @if (mensajeExito) {
        <p class="mensaje-exito">{{ mensajeExito }}</p>
      }

      @if (mensajeError) {
        <p class="mensaje-error">{{ mensajeError }}</p>
      }

    </form>
  </section>

</main>

<app-footer></app-footer>
