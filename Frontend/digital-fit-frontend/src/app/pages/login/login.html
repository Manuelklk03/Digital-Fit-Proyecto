<app-header></app-header>

<main class="zona-login">

  @if (mostrarPopup) {
  <div class="popup-mensaje" [class.popup-error]="tipoPopup === 'error'" [class.popup-exito]="tipoPopup === 'exito'">
    <span>{{ textoPopup }}</span>
    <button type="button" class="boton-cerrar-popup" (click)="cerrarPopup()">×</button>
  </div>
  }

  <section class="caja-login">

    <div class="bloque-superior">
      <div class="insignia-login">Acceso</div>
      <img src="img/usuario.png" alt="Icono de usuario" class="icono-usuario">
      <h1 class="titulo-login">Iniciar sesión</h1>
      <p class="texto-secundario">
        Accede a tu cuenta para entrar en tu panel de Digital-FIT.
      </p>
    </div>

    <form class="formulario-login" (ngSubmit)="iniciarSesion()">

      <div class="grupo-campo">
        <label class="texto-etiqueta" for="usuario">Nombre de usuario</label>
        <input class="campo-texto" type="text" id="usuario" name="usuario" [(ngModel)]="username" required
          placeholder="Introduce tu nombre de usuario">
      </div>

      <div class="grupo-campo">
        <label class="texto-etiqueta" for="contrasena">Contraseña</label>
        <input class="campo-texto" type="password" id="contrasena" name="contrasena" [(ngModel)]="password" required
          placeholder="Introduce tu contraseña">
      </div>

      <button class="boton-acceder" type="submit" [disabled]="cargando">
        @if (cargando) {
        Entrando...
        } @else {
        Iniciar sesión
        }
      </button>

      <p class="texto-registro">
        ¿No tienes cuenta?
        <a routerLink="/register">Regístrate</a>
      </p>
    </form>

  </section>
</main>

<app-footer></app-footer>
