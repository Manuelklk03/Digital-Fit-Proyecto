<app-header></app-header>

<main class="zona-registro">

  @if (mostrarPopup) {
  <div class="popup-mensaje" [class.popup-error]="tipoPopup === 'error'" [class.popup-exito]="tipoPopup === 'exito'">
    <span>{{ textoPopup }}</span>
    <button type="button" class="boton-cerrar-popup" (click)="cerrarPopup()">×</button>
  </div>
  }

  <section class="caja-registro">
    <div class="bloque-superior">
      <div class="insignia-registro">Nuevo usuario</div>
      <h1>Crear cuenta</h1>
      <p class="texto-secundario">
        Regístrate para empezar a usar Digital-FIT.
      </p>
    </div>

    <form class="formulario-registro" (ngSubmit)="registrar()">

      <div class="grupo-campo">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" [(ngModel)]="username" required
          placeholder="Introduce tu nombre de usuario">
      </div>

      <div class="grupo-campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="Introduce tu correo">
      </div>

      <div class="grupo-campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required
          placeholder="Introduce tu contraseña">
      </div>

      <button class="boton-principal" type="submit" [disabled]="cargando">
        @if (cargando) {
        Registrando...
        } @else {
        Registrarse
        }
      </button>
    </form>

    <p class="texto-login">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </section>
</main>

<app-footer></app-footer>
